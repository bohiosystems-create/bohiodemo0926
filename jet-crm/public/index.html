<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4f1e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SkyDesk">
  <title>SkyDesk CRM</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="bgfade" aria-hidden="true"></div>
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" class="logo"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg><span id="title">SkyDesk</span></div>
    <button id="syncBtn" class="sync" aria-label="Check inbox now"><span class="dot" id="syncDot"></span><span id="syncText">…</span></button>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <a href="#/" data-tab="requests"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Requests</a>
    <a href="#/contacts" data-tab="contacts"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.7 2.6 3 5.2"/></svg>Contacts</a>
    <a href="#/invoices" data-tab="invoices"><svg viewBox="0 0 24 24"><path d="M6 2.5h9l4 4V21.5l-2.5-1.5-2.5 1.5-2.5-1.5-2.5 1.5-2.5-1.5V2.5zM9 9h7M9 13h7M9 17h4"/></svg>Invoices</a>
    <a href="#/outbox" data-tab="outbox"><svg viewBox="0 0 24 24"><path d="M3 11.5 21 3l-8.5 18-2-7.5z"/></svg>RFQs</a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</a>
  </nav>
  <div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
  <div id="toast" class="toast" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="/bg3d.js" defer></script>
  <script src="/shared/pricing.js"></script>
  <script src="/app.js"></script>
</body>
</html>
